<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PEHub Story Cycler</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1F242F;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: #181c25;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a303d;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 500;
            color: #EEFB87;
        }

        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .controls button {
            background: #2a303d;
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }

        .controls button:hover {
            background: #EEFB87;
            color: #1F242F;
        }

        .controls button.active {
            background: #EEFB87;
            color: #1F242F;
        }

        .story-counter {
            font-size: 14px;
            color: #aaa;
        }

        .main-content {
            flex: 1;
            display: flex;
            position: relative;
            overflow: hidden;
        }

        .sidebar {
            width: 320px;
            background: #181c25;
            overflow-y: auto;
            border-right: 1px solid #2a303d;
            flex-shrink: 0;
        }

        .story-list {
            list-style: none;
        }

        .story-item {
            padding: 15px 20px;
            border-bottom: 1px solid #2a303d;
            cursor: pointer;
            transition: background 0.2s;
        }

        .story-item:hover {
            background: #2a303d;
        }
